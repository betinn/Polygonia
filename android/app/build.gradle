apply plugin: 'com.android.application'

// Assinatura: keystore FORA do repositório. O arquivo .properties tem storeFile, storePassword,
// keyAlias e keyPassword. Caminho em POLYGONIA_KEYSTORE_PROPERTIES (gradle.properties, variável de
// ambiente ou -P); padrão abaixo. Sem o arquivo, a build release sai sem assinatura.
def keystorePropertiesPath = project.findProperty('POLYGONIA_KEYSTORE_PROPERTIES') ?:
        System.getenv('POLYGONIA_KEYSTORE_PROPERTIES') ?:
        'C:/Users/sem-m/Polygonia-keys/keystore.properties'
def keystorePropertiesFile = file(keystorePropertiesPath)
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'io.github.betinn.polygonia'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId "io.github.betinn.polygonia"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode(getBuildVersionCode())
        versionName "${getVersion()}"

        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                abiFilters "arm64-v8a"
            }
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }

            ndk {
                debugSymbolLevel "FULL"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += "../../data"
    }

    packagingOptions {
        jniLibs {
            // Bibliotecas descompactadas e alinhadas a 16 KB (exigência da Play para targetSdk 35+).
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "androidx.viewpager2:viewpager2:1.1.0"
}

// Adapted from Dolphin.

def getVersion() {
    def versionNumber = '0.0-unknown'

    try {
        versionNumber = 'git describe --tags --exclude latest --exclude preview'.execute([], project.rootDir).text
                .trim()
                .replaceAll(/(-0)?-[^-]+$/, "")
    } catch (Exception e) {
        logger.error('Cannot find git, defaulting to dummy version number')
    }

    return versionNumber
}


def getBuildVersionCode() {
    try {
        def versionNumber = 'git rev-list --first-parent --count HEAD'.execute([], project.rootDir).text
                .trim()
        return Integer.valueOf(versionNumber);
    } catch (Exception e) {
        logger.error('Cannot find git, defaulting to dummy version number')
    }

    return 1;
}
